<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"
     font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"
     aria-label="TRANN4, Consilium Plebis, the Triumviratus 8.1 network: shared threat, pawn-pair and passed-pawn inputs and an int8 HalfKA block split into eight experts, chosen per side by the opponent's non-pawn material (the learned routing table stayed inactive); two 1024 accumulators, clipped ReLU with pairwise product, a cached pawn-king subnetwork added to the first layer of the stack, eight layer stacks chosen by piece count and a PSQT term">
  <title>TRANN4 &#8212; Consilium Plebis &#8212; Triumviratus 8.1 network architecture</title>
  <defs>
    <style>
      text       { fill: #E6EAF0; }
      .dim       { fill: #9AA6B6; }
      .gold      { fill: #E8C170; }
      .mono      { font-family: 'Cascadia Mono', Consolas, Menlo, monospace; }
      .sec       { font-size: 12px; letter-spacing: .14em; fill: #9AA6B6; font-weight: 600; }
      .box       { fill: #1B222D; stroke: #2A3340; }
      .verd      { fill: #27564C; stroke: #3F8C7C; }
      .verd-soft { fill: #1A302C; stroke: #2F6A5D; }
      .bronze    { fill: #5E4520; stroke: #C4913F; }
      .bz-soft   { fill: #2A2116; stroke: #8A6630; }
      .arrow     { stroke: #56647C; stroke-width: 1.6; fill: none; }
      .arrow-b   { stroke: #C4913F; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .arrow-v   { stroke: #3F8C7C; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56647C"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4913F"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F8C7C"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#11161E"/>

  <text x="40" y="48" font-size="24" font-weight="600">Consilium Plebis · the Triumviratus 8.1 network (TRANN4)</text>
  <text x="40" y="74" font-size="14" class="dim">The int8 HalfKA block is split into eight experts, chosen for each side by the opponent's non-pawn material. A cached pawn-king subnetwork feeds every layer stack.</text>

  <!-- ===== 1. INPUTS ===== -->
  <text x="40" y="116" class="sec">1 · INPUTS (FOR EACH SIDE) · 244,688</text>

  <rect x="40" y="132" width="320" height="40" rx="6" class="box"/>
  <text x="56" y="157" font-size="14">Threats <tspan class="dim" font-size="12">· who attacks what · shared</tspan></text>
  <text x="344" y="157" font-size="13" class="dim mono" text-anchor="end">59,808</text>

  <rect x="40" y="182" width="320" height="216" rx="8" fill="none" stroke="#3F8C7C" stroke-dasharray="4 4"/>
  <text x="56" y="205" font-size="14" font-weight="600">HalfKA × 8 experts <tspan class="dim" font-weight="400" font-size="12">(input buckets)</tspan></text>
  <text x="344" y="205" font-size="13" class="mono" text-anchor="end">8 × 22,528</text>
  <text x="56" y="225" font-size="12" class="dim">king × piece × square, 32 king buckets, int8 weights</text>
  <rect x="52" y="236" width="144" height="30" rx="5" class="verd-soft"/><text x="66" y="256" font-size="13">E0</text>
  <rect x="204" y="236" width="144" height="30" rx="5" class="verd-soft"/><text x="218" y="256" font-size="13">E1</text>
  <rect x="52" y="270" width="144" height="30" rx="5" class="verd-soft"/><text x="66" y="290" font-size="13">E2</text>
  <rect x="204" y="270" width="144" height="30" rx="5" class="verd-soft"/><text x="218" y="290" font-size="13">E3</text>
  <rect x="52" y="304" width="144" height="30" rx="5" class="verd-soft"/><text x="66" y="324" font-size="13">E4</text>
  <rect x="204" y="304" width="144" height="30" rx="5" class="verd"/><text x="218" y="324" font-size="13" font-weight="600">E5</text><text x="334" y="324" font-size="12" class="gold" font-weight="600" text-anchor="end">active</text>
  <rect x="52" y="338" width="144" height="30" rx="5" class="verd-soft"/><text x="66" y="358" font-size="13">E6</text>
  <rect x="204" y="338" width="144" height="30" rx="5" class="verd-soft"/><text x="218" y="358" font-size="13">E7</text>
  <text x="56" y="388" font-size="12" class="dim">one expert per side: the two sides may differ</text>

  <rect x="40" y="408" width="320" height="34" rx="6" class="box"/>
  <text x="56" y="430" font-size="14">PawnPair <tspan class="dim" font-size="12">· same / adjacent files · shared</tspan></text>
  <text x="344" y="430" font-size="13" class="dim mono" text-anchor="end">4,560</text>
  <rect x="40" y="450" width="320" height="34" rx="6" class="box"/>
  <text x="56" y="472" font-size="14">PassedPawns <tspan class="dim" font-size="12">· ours · shared</tspan></text>
  <text x="344" y="472" font-size="13" class="dim mono" text-anchor="end">96</text>

  <!-- ===== routing table ===== -->
  <rect x="40" y="516" width="320" height="136" rx="8" class="bz-soft"/>
  <text x="56" y="540" font-size="14" class="gold" font-weight="600">Learned routing table <tspan class="dim" font-weight="400" font-size="12">· inactive</tspan></text>
  <text x="56" y="562" font-size="12" class="dim">start: the opponent's non-pawn material</text>
  <text x="56" y="580" font-size="12" class="dim">N = B = 3 · R = 5 · Q = 9</text>
  <text x="344" y="580" font-size="13" class="mono" text-anchor="end">8 classes</text>
  <text x="56" y="600" font-size="12" class="dim">training moved under 1% of its cells:</text>
  <text x="56" y="620" font-size="12" class="dim">as if it were not there, each side's</text>
  <text x="56" y="638" font-size="12" class="dim">expert stays fixed by that material</text>
  <path d="M40,584 L22,584 L22,300 L37,300" class="arrow-b" marker-end="url(#b)"/>

  <!-- ===== 2. FEATURE TRANSFORMER ===== -->
  <text x="410" y="116" class="sec">2 · FEATURE TRANSFORMER</text>
  <text x="410" y="146" font-size="12" class="dim">computed twice, from each side's point of view</text>
  <text x="410" y="164" font-size="12" class="dim">(inputs relative to that side's king), same weights</text>
  <path d="M360,300 C380,300 380,240 394,240 L408,240" class="arrow" marker-end="url(#a)"/>
  <path d="M360,300 C380,300 380,340 394,340 L408,340" class="arrow" marker-end="url(#a)"/>
  <rect x="410" y="200" width="200" height="80" rx="8" class="box"/>
  <text x="510" y="226" font-size="12" class="dim" text-anchor="middle">accumulator · side to move</text>
  <text x="510" y="254" font-size="20" font-weight="600" text-anchor="middle">1024</text>
  <text x="510" y="272" font-size="12" class="dim" text-anchor="middle">+ 8 PSQT values</text>
  <rect x="410" y="300" width="200" height="80" rx="8" class="box"/>
  <text x="510" y="326" font-size="12" class="dim" text-anchor="middle">accumulator · opponent</text>
  <text x="510" y="354" font-size="20" font-weight="600" text-anchor="middle">1024</text>
  <text x="510" y="372" font-size="12" class="dim" text-anchor="middle">+ 8 PSQT values</text>
  <text x="640" y="400" font-size="12" class="dim">updated incrementally: only the rows</text>
  <text x="640" y="416" font-size="12" class="dim">of the pieces that moved are added</text>
  <text x="640" y="432" font-size="12" class="dim">and subtracted; int8 rows, half the bytes</text>

  <!-- ===== 3. ACTIVATION ===== -->
  <text x="650" y="116" class="sec">3 · ACTIVATION</text>
  <path d="M610,240 L648,240" class="arrow" marker-end="url(#a)"/>
  <path d="M610,340 L648,340" class="arrow" marker-end="url(#a)"/>
  <rect x="650" y="200" width="170" height="80" rx="8" class="box"/>
  <text x="735" y="228" font-size="12" class="dim" text-anchor="middle">clipped ReLU,</text>
  <text x="735" y="244" font-size="12" class="dim" text-anchor="middle">pairwise product</text>
  <text x="735" y="268" font-size="16" class="mono" text-anchor="middle">1024 → 512</text>
  <rect x="650" y="300" width="170" height="80" rx="8" class="box"/>
  <text x="735" y="328" font-size="12" class="dim" text-anchor="middle">clipped ReLU,</text>
  <text x="735" y="344" font-size="12" class="dim" text-anchor="middle">pairwise product</text>
  <text x="735" y="368" font-size="16" class="mono" text-anchor="middle">1024 → 512</text>
  <path d="M820,240 C840,240 840,290 854,290" class="arrow"/>
  <path d="M820,340 C840,340 840,290 854,290 L868,290" class="arrow" marker-end="url(#a)"/>
  <rect x="870" y="270" width="110" height="40" rx="20" class="box"/>
  <text x="925" y="295" font-size="13" class="mono" text-anchor="middle">concat 1024</text>
  <path d="M980,290 L990,290 Q996,290 996,284 L996,198 Q996,192 1002,192 L1028,192" class="arrow" marker-end="url(#a)"/>

  <!-- ===== pawn-king subnetwork ===== -->
  <rect x="650" y="456" width="330" height="168" rx="8" class="verd-soft"/>
  <text x="666" y="480" font-size="14" font-weight="600">Pawn-king subnetwork <tspan class="dim" font-weight="400" font-size="12">· new</tspan></text>
  <text x="666" y="502" font-size="12" class="dim">own and enemy pawns, both kings</text>
  <text x="666" y="520" font-size="12" class="dim">from the side to move's view</text>
  <text x="964" y="520" font-size="13" class="mono" text-anchor="end">256</text>
  <text x="666" y="548" font-size="14" class="mono">256 → 256 → 32</text>
  <text x="666" y="566" font-size="12" class="dim">clipped ReLU between the two layers</text>
  <text x="666" y="590" font-size="12" class="dim">cached per thread by pawns and kings:</text>
  <text x="666" y="608" font-size="12" class="dim">computed only when that key is new</text>
  <path d="M980,480 L998,480 Q1004,480 1004,474 L1004,253 Q1004,247 1010,247 L1028,247" class="arrow-v" marker-end="url(#v)"/>

  <!-- ===== 4. LAYER STACK ===== -->
  <text x="1010" y="116" class="sec">4 · LAYER STACK (1 OF 8)</text>
  <rect x="1010" y="130" width="390" height="540" rx="10" fill="none" stroke="#C4913F" stroke-dasharray="5 4"/>
  <text x="1205" y="154" font-size="13" class="gold" font-weight="600" text-anchor="middle">bucket = (pieces − 1) / 4</text>

  <rect x="1030" y="170" width="350" height="44" rx="6" class="bronze"/>
  <text x="1046" y="198" font-size="14" font-weight="600">fc_0 · sparse affine</text>
  <text x="1366" y="198" font-size="14" class="mono" text-anchor="end">1024 → 32</text>
  <path d="M1205,214 L1205,228" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="230" width="350" height="34" rx="6" class="verd-soft"/>
  <text x="1046" y="252" font-size="13">+ pawn-king output</text>
  <text x="1366" y="252" font-size="13" class="mono" text-anchor="end">32</text>
  <path d="M1205,264 L1205,278" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="280" width="170" height="40" rx="6" class="box"/>
  <text x="1115" y="305" font-size="13" text-anchor="middle">squared CReLU · 32</text>
  <rect x="1210" y="280" width="170" height="40" rx="6" class="box"/>
  <text x="1295" y="305" font-size="13" text-anchor="middle">CReLU · 32</text>
  <path d="M1205,320 L1205,340" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="342" width="350" height="44" rx="6" class="bronze"/>
  <text x="1046" y="370" font-size="14" font-weight="600">fc_1 · affine</text>
  <text x="1366" y="370" font-size="14" class="mono" text-anchor="end">64 → 32</text>
  <path d="M1205,386 L1205,404" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="406" width="170" height="40" rx="6" class="box"/>
  <text x="1115" y="431" font-size="13" text-anchor="middle">squared CReLU · 32</text>
  <rect x="1210" y="406" width="170" height="40" rx="6" class="box"/>
  <text x="1295" y="431" font-size="13" text-anchor="middle">CReLU · 32</text>
  <path d="M1205,446 L1205,464" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="466" width="350" height="44" rx="6" class="box"/>
  <text x="1046" y="488" font-size="13">concat of both activation pairs</text>
  <text x="1046" y="503" font-size="11" class="dim">skip: the output also sees the fc_0 layer</text>
  <text x="1366" y="494" font-size="14" class="mono" text-anchor="end">128</text>
  <path d="M1205,510 L1205,528" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="530" width="350" height="44" rx="6" class="bronze"/>
  <text x="1046" y="558" font-size="14" font-weight="600">fc_2 · affine</text>
  <text x="1366" y="558" font-size="14" class="mono" text-anchor="end">128 → 1</text>
  <path d="M1205,574 L1205,592" class="arrow" marker-end="url(#a)"/>

  <rect x="1030" y="594" width="350" height="40" rx="6" class="box"/>
  <text x="1046" y="619" font-size="13">+ fc_0[30] − fc_0[31]</text>
  <text x="1366" y="619" font-size="12" class="dim" text-anchor="end">skip from fc_0</text>
  <text x="1205" y="656" font-size="12" class="dim" text-anchor="middle">8 such stacks, one per 4 pieces: 1–4, 5–8, … 29–32</text>

  <!-- ===== piece count ===== -->
  <rect x="500" y="644" width="180" height="36" rx="18" fill="#2A2116" stroke="#C4913F"/>
  <text x="590" y="667" font-size="14" class="gold" font-weight="600" text-anchor="middle">piece count</text>
  <path d="M680,662 L1006,662" class="arrow-b" marker-end="url(#b)"/>
  <path d="M530,680 L530,728" class="arrow-b" marker-end="url(#b)"/>
  <text x="700" y="682" font-size="12" class="dim">picks the layer stack and the PSQT bucket</text>

  <!-- ===== 5. OUTPUT ===== -->
  <text x="40" y="700" class="sec">5 · OUTPUT</text>
  <rect x="410" y="730" width="360" height="56" rx="8" class="box"/>
  <text x="426" y="754" font-size="14" font-weight="600">PSQT term</text>
  <text x="426" y="774" font-size="12" class="dim">side to move − opponent, same bucket</text>
  <text x="800" y="766" font-size="22" class="dim" text-anchor="middle">+</text>
  <rect x="830" y="730" width="300" height="56" rx="8" class="bronze"/>
  <text x="846" y="754" font-size="14" font-weight="600">positional term</text>
  <text x="846" y="774" font-size="12" class="dim">output of the layer stack</text>
  <text x="1160" y="766" font-size="22" class="dim" text-anchor="middle">=</text>
  <rect x="1190" y="730" width="210" height="56" rx="8" class="verd"/>
  <text x="1295" y="754" font-size="16" font-weight="600" text-anchor="middle">evaluation</text>
  <text x="1295" y="774" font-size="12" class="dim" text-anchor="middle">weighted sum, then scaled</text>
  <path d="M440,380 L440,728" class="arrow" marker-end="url(#a)"/>
  <text x="448" y="540" font-size="11" class="dim">PSQT</text>
  <path d="M1205,670 C1205,700 980,700 980,714 L980,728" class="arrow" marker-end="url(#a)"/>

  <!-- footer -->
  <text x="40" y="826" font-size="13" class="dim">New in Consilium Plebis: each side's expert is set by the opponent's non-pawn material, in eight classes (0–3, 4–5, 6–8, 9, 10–13, 14–18, 19–25, 26–31). The routing</text>
  <text x="40" y="846" font-size="13" class="dim">table can be learned in training, but it moved under 1% of its cells, so it stays inactive. Pawn captures never change an expert. HalfKA rows are int8: eight experts, memory of four.</text>
  <text x="40" y="866" font-size="13" class="dim">The pawn-king subnetwork adds 32 values to the first layer of every stack and reads no feature-transformer row. Threats, pawn pairs and PassedPawns are as in 8.0.</text>
</svg>
